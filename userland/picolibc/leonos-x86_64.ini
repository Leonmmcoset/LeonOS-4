[binaries]
c = 'clang'
ar = 'llvm-ar'
ld = 'ld.lld'
strip = 'llvm-strip'

[properties]
needs_exe_wrapper = true
skip_sanity_check = true

[built-in options]
c_args = ['-target', 'x86_64-unknown-none', '-O2', '-std=c11', '-ffreestanding', '-nostdlibinc', '-fno-stack-protector', '-fno-pic', '-fno-pie', '-mno-red-zone']
c_link_args = ['-target', 'x86_64-unknown-none', '-nostdlib', '-fno-pic', '-fno-pie', '-mno-red-zone']

[host_machine]
system = 'none'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
