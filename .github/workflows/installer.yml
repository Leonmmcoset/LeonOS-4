name: Build and upload artifact (manual)

on:
  workflow_dispatch:
    inputs:
      build_ninja_out:
        description: '生成的 ninja 文件 (默认: build.ninja)'
        required: false
        default: 'build.ninja'
      ninja_targets:
        description: 'ninja 目标 (默认: all image-vmdk)'
        required: false
        default: 'all image-vmdk'
      artifact_name:
        description: '上传的 artifact 名称 (默认: leonos-build)'
        required: false
        default: 'leonos-build'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_NINJA: build.ninja
      NINJA_TARGETS: "all image-vmdk"
      ARTIFACT_NAME: leonos-build

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Apply workflow_dispatch overrides
      if: github.event_name == 'workflow_dispatch'
      run: |
        if [ -n "${{ github.event.inputs.build_ninja_out }}" ]; then echo "BUILD_NINJA=${{ github.event.inputs.build_ninja_out }}" >> $GITHUB_ENV; fi
        if [ -n "${{ github.event.inputs.ninja_targets }}" ]; then echo "NINJA_TARGETS=${{ github.event.inputs.ninja_targets }}" >> $GITHUB_ENV; fi
        if [ -n "${{ github.event.inputs.artifact_name }}" ]; then echo "ARTIFACT_NAME=${{ github.event.inputs.artifact_name }}" >> $GITHUB_ENV; fi

    - name: Install system packages
      run: |
        sudo apt-get update
        sudo apt-get install -y python3 python3-pip python3-venv ninja-build build-essential pkg-config git || true
        # 如果你的构建需要额外原生包（如 ncurses/bison/flex 等），在这里添加

    - name: Prepare Python deps (if any)
      run: |
        python3 -m pip install --upgrade pip || true
        # 如果 tools/gen_ninja.py 依赖第三方包，可在此安装，例如：pip install somepkg

    - name: Generate ninja build file (per README)
      run: |
        echo "Generating ninja file: $BUILD_NINJA"
        if [ -f tools/gen_ninja.py ]; then
          python3 tools/gen_ninja.py --out "$BUILD_NINJA"
          echo "Generated $BUILD_NINJA:"
          ls -la "$BUILD_NINJA" || true
        else
          echo "tools/gen_ninja.py not found — aborting"
          ls -la
          exit 1
        fi

    - name: Run ninja (use generated build.ninja)
      run: |
        set -e
        echo "Running: ninja -f $BUILD_NINJA $NINJA_TARGETS"
        ninja -f "$BUILD_NINJA" $NINJA_TARGETS

    - name: List build tree for debugging
      run: |
        echo "Top-level files:"
        ls -la
        echo "build / out / images (if exist):"
        ls -la build || true
        ls -la out || true
        ls -la build/images || true

    - name: Upload build artifacts (ISO / VMDK)
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.ARTIFACT_NAME }}
        path: |
          build/**/*.iso
          build/**/*.vmdk
          build/images/*.iso
          build/images/*.vmdk
          *.iso
          *.vmdk