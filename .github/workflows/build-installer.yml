name: Build LeonOS 4

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      installer_root_size_mib:
        description: Installer runtime root size in MiB (32-4096)
        required: false
        default: "400"
        type: string
      installed_system_requires_license:
        description: Require activation after the installer deploys the system
        required: false
        default: true
        type: boolean
      license_server_url:
        description: HTTP(S) license server URL baked into the installer
        required: false
        default: http://127.0.0.1:30301
        type: string
      license_debug_log:
        description: Include license and OOBE activation debug logs
        required: false
        default: true
        type: boolean
      # ---------- 新增输入 ----------
      upload_artifacts:
        description: Upload build artifacts (VMDK, ISO, etc.)
        required: false
        default: false
        type: boolean
      # -----------------------------

permissions:
  contents: read

concurrency:
  group: leonos4-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            ninja-build \
            meson \
            clang \
            llvm \
            lld \
            grub-efi-amd64-bin \
            grub-pc-bin \
            grub-common \
            xorriso \
            mtools \
            dosfstools \
            gdisk \
            qemu-utils \
            python3 \
            python3-pil \
            git \
            make \
            bison \
            flex \
            bc \
            pkg-config \
            autoconf \
            automake \
            libtool \
            libtool-bin \
            gawk

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-unknown-none

      - name: Verify toolchain
        run: |
          set -euo pipefail

          clang --version
          ld.lld --version
          llvm-ar --version
          meson --version
          grub-mkstandalone --version
          grub-mkrescue --version
          qemu-img --version
          rustc --version
          cargo --version

      - name: Verify third-party sources
        run: |
          set -euo pipefail

          test -f third_party/picolibc/meson.build
          test -f third_party/busybox/Makefile
          git -C third_party/picolibc rev-parse --verify HEAD
          git -C third_party/busybox rev-parse --verify HEAD
          git submodule status --recursive

      - name: Prepare build configuration
        env:
          KCONFIG_INSTALLER_ROOT_SIZE_MIB: ${{ inputs.installer_root_size_mib }}
          KCONFIG_INSTALLER_INSTALLED_REQUIRE_LICENSE: ${{ inputs.installed_system_requires_license }}
          KCONFIG_LICENSE_SERVER_URL: ${{ inputs.license_server_url }}
          KCONFIG_LICENSE_DEBUG_LOG: ${{ inputs.license_debug_log }}
        run: |
          set -euo pipefail

          : "${KCONFIG_INSTALLER_ROOT_SIZE_MIB:=128}"
          : "${KCONFIG_INSTALLER_INSTALLED_REQUIRE_LICENSE:=true}"
          : "${KCONFIG_LICENSE_SERVER_URL:=http://127.0.0.1:30301}"
          : "${KCONFIG_LICENSE_DEBUG_LOG:=true}"

          config_path=buildsystem/config/leonos.conf
          mkdir -p "$(dirname "$config_path")"
          cp configs/default.conf "$config_path"

          set_config() {
            local key=$1
            local value=$2
            sed -i "/^${key}=/d;/^# ${key} is not set$/d" "$config_path"
            printf '%s=%s\n' "$key" "$value" >> "$config_path"
          }

          set_bool() {
            local key=$1
            local value=$2
            case "$value" in
              true) set_config "$key" y ;;
              false) set_config "$key" n ;;
              *) echo "invalid boolean for $key: $value" >&2; exit 1 ;;
            esac
          }

          if ! [[ "$KCONFIG_INSTALLER_ROOT_SIZE_MIB" =~ ^[0-9]+$ ]] || \
             (( KCONFIG_INSTALLER_ROOT_SIZE_MIB < 32 || KCONFIG_INSTALLER_ROOT_SIZE_MIB > 4096 )); then
            echo "installer_root_size_mib must be an integer from 32 to 4096" >&2
            exit 1
          fi
          case "$KCONFIG_LICENSE_SERVER_URL" in
            http://*|https://*) ;;
            *) echo "license_server_url must start with http:// or https://" >&2; exit 1 ;;
          esac
          if [[ "$KCONFIG_LICENSE_SERVER_URL" =~ [[:space:]\"\\\\] ]]; then
            echo "license_server_url must not contain whitespace, quotes, or backslashes" >&2
            exit 1
          fi

          set_config CONFIG_INSTALLER_ROOT_SIZE_MIB "$KCONFIG_INSTALLER_ROOT_SIZE_MIB"
          set_bool CONFIG_INSTALLER_INSTALLED_REQUIRE_LICENSE "$KCONFIG_INSTALLER_INSTALLED_REQUIRE_LICENSE"
          set_config CONFIG_LICENSE_SERVER_URL "\"$KCONFIG_LICENSE_SERVER_URL\""
          set_bool CONFIG_LICENSE_DEBUG_LOG "$KCONFIG_LICENSE_DEBUG_LOG"

      - name: Verify dynamic component configuration
        run: |
          set -euo pipefail

          python3 tools/generate_component_kconfig.py \
            --output build/generated/ci-Kconfig.components \
            --json build/generated/ci-components.json
          python3 tools/test_component_config.py
          python3 build.py info release --profile default >/dev/null
          python3 build.py info installer-root --profile default \
            --set CONFIG_LEON_COMPONENT_APP_OOBE_BUILD=n >/dev/null
          python3 build.py info app:stardusthello --profile default \
            --set CONFIG_LEON_COMPONENT_LIB_STARDUSTUI_BUILD=n >/dev/null
          if python3 build.py info userland --profile default \
              --set CONFIG_NOT_A_REAL_OPTION=y; then
            echo "unknown CONFIG override unexpectedly succeeded" >&2
            exit 1
          fi

      - name: Build LeonOS images
        run: |
          set -euo pipefail

          python3 ./build.py run image-vmdk
          python3 ./build.py run image-iso
          python3 ./build.py run installer

      - name: Verify generated images
        run: |
          set -euo pipefail

          test -s build/images/leonos4.vmdk
          test -s build/images/leonos4.iso
          test -s build/images/leonos4-installer.iso
          qemu-img info build/images/leonos4.vmdk

      # ---------- 新增：生成构建摘要 Markdown ----------
      - name: Generate build summary
        run: |
          cat > build-summary.md <<EOF
          # LeonOS 4 Build Summary

          **Run ID:** ${{ github.run_id }}
          **Run Number:** ${{ github.run_number }}
          **Commit:** ${{ github.sha }}
          **Ref:** ${{ github.ref }}
          **Triggered by:** ${{ github.actor }}
          **Build Date:** $(date -u)

          ## Input Parameters
          - installer_root_size_mib: ${{ inputs.installer_root_size_mib }}
          - installed_system_requires_license: ${{ inputs.installed_system_requires_license }}
          - license_server_url: ${{ inputs.license_server_url }}
          - license_debug_log: ${{ inputs.license_debug_log }}
          - upload_artifacts: ${{ inputs.upload_artifacts }}

          ## Generated Artifacts
          - leonos4.vmdk
          - leonos4.iso
          - leonos4-installer.iso
          - leonos.conf
          - build-summary.md (this file)

          ## Retention Policy
          Artifacts will be automatically deleted after 3 days.
          EOF

          # 同时写入 GitHub Step Summary，便于在 Actions 页面查看
          cat build-summary.md >> $GITHUB_STEP_SUMMARY

      # ---------- 修改：条件上传 + 设置保留天数 ----------
      - name: Upload LeonOS artifacts
        if: inputs.upload_artifacts == 'true'   # 仅当用户允许上传时才执行
        uses: actions/upload-artifact@v4
        with:
          name: LeonOS-4-${{ github.run_number }}
          path: |
            build/images/leonos4.vmdk
            build/images/leonos4.iso
            build/images/leonos4-installer.iso
            buildsystem/config/leonos.conf
            build-summary.md                       # 包含摘要文档
          if-no-files-found: error
          compression-level: 0
          retention-days: 3                        # 3天后自动删除