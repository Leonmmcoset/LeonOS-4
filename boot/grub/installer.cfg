set timeout=5
set default=0
insmod serial
insmod terminal
insmod part_gpt
insmod fat
insmod iso9660
insmod multiboot2
insmod all_video
insmod font
insmod gfxterm
search --no-floppy --file /boot/leonos-installer-iso.marker --set=root
if [ -f ($root)/boot/grub/fonts/leonos-unicode.pf2 ]; then
    loadfont ($root)/boot/grub/fonts/leonos-unicode.pf2
fi
set color_normal=light-gray/black
set color_highlight=black/light-gray
set gfxmode=auto
set gfxpayload=keep
serial --unit=0 --speed=115200
terminal_input console serial
terminal_output gfxterm serial

menuentry "Install LeonOS 4" {
    multiboot2 /boot/loader.elf boot_disk=0 root=ram:0 log=screen,serial mode=installer autospawn=installer
    module2 /system/kernel.sys leonos-kernel
    module2 /system/middlelayer.sys leonos-middlelayer
    module2 /install/root.fat leonos-installer-root
    boot
}

menuentry "Install LeonOS 4 (Enable boot log screen)" {
    multiboot2 /boot/loader.elf boot_disk=0 root=ram:0 log=screen,serial bootlog=1 mode=installer autospawn=installer
    module2 /system/kernel.sys leonos-kernel
    module2 /system/middlelayer.sys leonos-middlelayer
    module2 /install/root.fat leonos-installer-root
    boot
}

menuentry "Install LeonOS 4 (debug log)" {
    multiboot2 /boot/loader.elf boot_disk=0 root=ram:0 log=screen,serial bootlog=1 debug=1 mode=installer autospawn=installer
    module2 /system/kernel.sys leonos-kernel
    module2 /system/middlelayer.sys leonos-middlelayer
    module2 /install/root.fat leonos-installer-root
    boot
}

menuentry "Reboot" {
    reboot
}
