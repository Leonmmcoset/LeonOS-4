set timeout=5
set default=0
insmod serial
insmod terminal
insmod part_gpt
insmod fat
insmod multiboot2
insmod all_video
insmod gfxterm
set color_normal=light-gray/black
set color_highlight=black/light-gray
set gfxmode=auto
set gfxpayload=keep
serial --unit=0 --speed=115200
terminal_input console serial
terminal_output gfxterm serial

menuentry "LeonOS 4" {
    set root=(hd0,gpt1)
    multiboot2 /boot/loader.elf boot_disk=0 root=0:/ log=screen,serial
    boot
}

menuentry "LeonOS 4 (debug log)" {
    set root=(hd0,gpt1)
    multiboot2 /boot/loader.elf boot_disk=0 root=0:/ log=screen,serial debug=1 autospawn=hello autospawn=uidemo
    boot
}

menuentry "Reboot" {
    reboot
}
