set timeout=0
set default=0
insmod serial
insmod terminal
insmod fat
insmod iso9660
insmod multiboot2
insmod all_video
search --no-floppy --file /leonos-installer-iso.marker --set=root
set gfxmode=auto
set gfxpayload=keep
serial --unit=0 --speed=115200
terminal_output console serial
menuentry "LeonOS musl ABI probes" {
    multiboot2 /loader.elf root=/ log=serial mode=installer autospawn=installer autospawn=linuxabi
    module2 /leonos/kernel.sys leonos-kernel
    module2 /leonos/middlelayer.sys leonos-middlelayer
    module2 /install/root.fat leonos-installer-root
    boot
}
